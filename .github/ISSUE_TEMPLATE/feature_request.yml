name: Feature Request
description: 新功能建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出新功能建议！请描述用户故事与验收标准。
  - type: textarea
    id: user_story
    attributes:
      label: 用户故事
      placeholder: |
        作为 <角色>
        我想要 <功能>
        以便 <价值>
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      placeholder: |
        - [ ] 条件 1
        - [ ] 条件 2
        - [ ] 条件 3
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: 影响面
      options:
        - 仅 UI/前端
        - 仅 API/后端
        - 全栈（UI+API+DB）
        - 基础设施/配置
        - 文档/工具
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - P0 - 阻塞/立即
        - P1 - 高/本 Sprint
        - P2 - 中/下个 Sprint
        - P3 - 低/有空再做
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案/变通方法
      placeholder: 目前如何绕过该问题...
  - type: textarea
    id: context
    attributes:
      label: 补充上下文/截图/参考链接
      placeholder: 相关 Issue、PR、设计稿、竞品参考...