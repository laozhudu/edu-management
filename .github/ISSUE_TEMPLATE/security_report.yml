name: Security Report
description: 私密安全漏洞上报（仅维护者可见）
title: "[Security] "
labels: ["security"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **请勿在公开 Issue 中披露安全漏洞细节**。此表单仅维护者可见。
  - type: input
    id: cve
    attributes:
      label: CVE 编号（如有）
      placeholder: CVE-2024-XXXXX
  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      options:
        - Critical (CVSS 9.0-10.0)
        - High (CVSS 7.0-8.9)
        - Medium (CVSS 4.0-6.9)
        - Low (CVSS 0.1-3.9)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 漏洞描述
      placeholder: 详细描述漏洞类型、触发条件、影响范围...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影响评估
      placeholder: 影响的组件、数据、用户范围...
    validations:
      required: true
  - type: textarea
    id: mitigation
    attributes:
      label: 临时缓解方案
      placeholder: 升级版本、配置变更、WAF 规则等...
  - type: textarea
    id: fix
    attributes:
      label: 建议修复方案
      placeholder: 代码修复、补丁、配置调整...
  - type: checkboxes
    id: disclosure
    attributes:
      label: 披露偏好
      options:
        - label: 同意在修复发布后公开披露
          required: false
        - label: 请求协调披露时间线
          required: false