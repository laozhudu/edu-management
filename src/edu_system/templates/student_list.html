<!-- 学生信息页（M5-G 双端一致：Web 端） -->
{% extends "index.html" %}

{% block title %}学生信息 - 教务管理系统{% endblock %}

{% block content %}
<div class="card" x-data="studentList()">
    <!-- 工具栏：搜索 + 筛选 + 刷新 -->
    <div class="card-body border-b border-gray-200 dark:border-gray-700">
        <div class="flex flex-wrap gap-3 items-end">
            <div class="flex-1 min-w-[200px]">
                <label class="label" for="keyword">关键字</label>
                <input id="keyword" type="text" class="input" placeholder="姓名 / 学号"
                       x-model="filters.keyword"
                       @keydown.enter="load(1)">
            </div>
            <div>
                <label class="label" for="grade">年级</label>
                <select id="grade" class="select w-32" x-model="filters.grade" @change="load(1)">
                    <option value="">全部</option>
                    <option value="初一级">初一级</option>
                    <option value="初二级">初二级</option>
                    <option value="初三级">初三级</option>
                </select>
            </div>
            <div>
                <label class="label" for="status">学籍状态</label>
                <select id="status" class="select w-32" x-model="filters.status" @change="load(1)">
                    <option value="">全部</option>
                    <option value="在校">在校</option>
                    <option value="休学">休学</option>
                    <option value="转学">转学</option>
                    <option value="毕业">毕业</option>
                </select>
            </div>
            <button class="btn btn-primary" @click="load(1)">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                查询
            </button>
            <button class="btn btn-secondary" @click="resetFilters()">重置</button>
            <button class="btn btn-primary" @click="openEdit(null)">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                新增学生
            </button>
        </div>
    </div>

    <!-- 新增/编辑对话框 -->
    <div x-show="showEditor" class="fixed inset-0 z-50 flex items-center justify-center bg-black/30 p-4"
         @click.away="showEditor = false">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl w-full max-w-md p-6">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4"
                x-text="editingId ? '编辑学生' : '新增学生'"></h3>
            <div class="space-y-3">
                <div>
                    <label class="label" for="edit-name">姓名 *</label>
                    <input id="edit-name" type="text" class="input" x-model="editForm.name" placeholder="学生姓名">
                </div>
                <div>
                    <label class="label" for="edit-no">学号</label>
                    <input id="edit-no" type="text" class="input" x-model="editForm.student_no" placeholder="座号/学号">
                </div>
                <div>
                    <label class="label" for="edit-gender">性别</label>
                    <select id="edit-gender" class="select w-full" x-model="editForm.gender">
                        <option value="">—</option>
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div>
                    <label class="label" for="edit-class">班级 *</label>
                    <select id="edit-class" class="select w-full" x-model="editForm.class_id">
                        <template x-for="c in classes" :key="c.id">
                            <option :value="c.id" x-text="c.name"></option>
                        </template>
                    </select>
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-2">
                <button class="btn btn-secondary" @click="showEditor = false">取消</button>
                <button class="btn btn-primary" @click="save()" :disabled="saving">
                    <span x-show="!saving">保存</span>
                    <span x-show="saving">保存中...</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 数据表 -->
    <div class="overflow-x-auto">
        <table class="table">
            <thead>
                <tr>
                    <th>学号</th>
                    <th>姓名</th>
                    <th>性别</th>
                    <th>班级</th>
                    <th>入学年份</th>
                    <th>学籍状态</th>
                    <th>座号</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <template x-for="s in list" :key="s.id">
                    <tr>
                        <td x-text="s.student_no"></td>
                        <td class="font-medium" x-text="s.name"></td>
                        <td x-text="s.gender || '—'"></td>
                        <td x-text="s.class_name || '—'"></td>
                        <td x-text="s.enroll_year || '—'"></td>
                        <td>
                            <span class="badge"
                                  :class="statusClass(s.status)"
                                  x-text="s.status || '—'"></span>
                        </td>
                        <td x-text="s.seat_no || '—'"></td>
                        <td>
                            <button class="btn btn-ghost btn-sm" @click="openEdit(s.id)">编辑</button>
                            <button class="btn btn-ghost btn-sm text-red-500" @click="remove(s.id, s.name)">删除</button>
                        </td>
                    </tr>
                </template>
                <tr x-show="!loading && list.length === 0">
                    <td colspan="7" class="text-center py-8 text-gray-500 dark:text-gray-400">
                        暂无学生数据
                    </td>
                </tr>
                <tr x-show="loading">
                    <td colspan="7" class="py-8">
                        <div class="skeleton-text w-2/3 mx-auto"></div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 分页 -->
    <div class="card-footer flex items-center justify-between">
        <div class="text-sm text-gray-500 dark:text-gray-400">
            共 <span x-text="total"></span> 条 · 第 <span x-text="page"></span>/<span x-text="totalPages()"></span> 页
        </div>
        <div class="pagination">
            <button class="pagination-btn" :disabled="page <= 1" @click="load(page-1)">上一页</button>
            <button class="pagination-btn" :disabled="page >= totalPages()" @click="load(page+1)">下一页</button>
        </div>
    </div>
</div>

<script>
    function studentList() {
        return {
            list: [],
            total: 0,
            page: 1,
            pageSize: 20,
            loading: false,
            filters: { keyword: '', grade: '', status: '' },
            classes: [],
            showEditor: false,
            editingId: null,
            editForm: { name: '', student_no: '', gender: '', class_id: '' },
            saving: false,
            
            async loadClasses() {
                try {
                    const resp = await fetch('/api/class?page_size=200', {
                        credentials: 'include', headers: authHeaders()
                    });
                    if (resp.ok) {
                        const d = await resp.json();
                        this.classes = d.items || d || [];
                    }
                } catch (e) {
                    console.error('加载班级列表失败:', e);
                }
            },
            
            openEdit(id) {
                this.editingId = id;
                if (id) {
                    const s = this.list.find(x => x.id === id);
                    this.editForm = {
                        name: s?.name || '', student_no: s?.student_no || '',
                        gender: s?.gender || '', class_id: s?.class_id || ''
                    };
                } else {
                    this.editForm = { name: '', student_no: '', gender: '', class_id: this.classes[0]?.id || '' };
                }
                this.showEditor = true;
            },
            
            async save() {
                if (!this.editForm.name || !this.editForm.class_id) {
                    alert('姓名和班级为必填项');
                    return;
                }
                this.saving = true;
                try {
                    const url = this.editingId ? `/api/students/${this.editingId}` : '/api/students';
                    const method = this.editingId ? 'PUT' : 'POST';
                    const resp = await fetch(url, {
                        method,
                        credentials: 'include',
                        headers: { ...authHeaders(), 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.editForm)
                    });
                    if (resp.ok || resp.status === 201) {
                        this.showEditor = false;
                        this.load(this.page);
                    } else {
                        const d = await resp.json().catch(() => ({}));
                        alert(d.detail || '保存失败');
                    }
                } catch (e) {
                    console.error('保存学生失败:', e);
                    alert('保存失败: ' + e.message);
                } finally {
                    this.saving = false;
                }
            },
            
            async remove(id, name) {
                if (!confirm(`确定删除学生「${name}」？此操作不可恢复。`)) return;
                try {
                    const resp = await fetch(`/api/students/${id}`, {
                        method: 'DELETE',
                        credentials: 'include',
                        headers: authHeaders()
                    });
                    if (resp.ok) {
                        this.load(this.page);
                    } else {
                        const d = await resp.json().catch(() => ({}));
                        alert(d.detail || '删除失败');
                    }
                } catch (e) {
                    console.error('删除学生失败:', e);
                    alert('删除失败: ' + e.message);
                }
            },
            
            async load(p) {
                this.page = p || 1;
                this.loading = true;
                try {
                    const params = new URLSearchParams({
                        page: this.page,
                        page_size: this.pageSize,
                        ...this.filters
                    });
                    const resp = await fetch('/api/students?' + params, {
                        credentials: 'include',
                        headers: authHeaders()
                    });
                    if (resp.ok) {
                        const d = await resp.json();
                        this.list = d.items || [];
                        this.total = d.total || 0;
                    } else if (resp.status === 401) {
                        window.location.href = '/login';
                    }
                } catch (e) {
                    console.error('加载学生列表失败:', e);
                } finally {
                    this.loading = false;
                }
            },
            
            resetFilters() {
                this.filters = { keyword: '', grade: '', status: '' };
                this.load(1);
            },
            
            totalPages() {
                return Math.max(1, Math.ceil(this.total / this.pageSize));
            },
            
            statusClass(st) {
                return {
                    '在校': 'badge-success',
                    '休学': 'badge-warning',
                    '转学': 'badge-gray',
                    '毕业': 'badge-gray',
                }[st] || 'badge-gray';
            },
            
            init() {
                this.loadClasses();
                this.load(1);
            }
        };
    }
</script>
{% endblock %}
