<!-- 学期概览页（M5-G 双端一致：Web 端 home/dashboard） -->
{% extends "index.html" %}

{% block title %}学期概览 - 教务管理系统{% endblock %}

{% block content %}
<div class="space-y-4 max-w-6xl mx-auto px-4" x-data="overviewStats()">
    <!-- 学期信息条 -->
    <div class="card">
        <div class="card-header flex items-center justify-between">
            <h2 class="text-lg font-semibold">当前学期</h2>
            <span class="badge badge-primary" x-text="semester?.label || '—'"></span>
        </div>
        <div class="card-body grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="p-4 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
                <div class="text-sm text-gray-500 dark:text-gray-400">在校学生</div>
                <div class="text-2xl font-bold mt-1" x-text="stats.students ?? '—'"></div>
            </div>
            <div class="p-4 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
                <div class="text-sm text-gray-500 dark:text-gray-400">班级数</div>
                <div class="text-2xl font-bold mt-1" x-text="stats.classes ?? '—'"></div>
            </div>
            <div class="p-4 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
                <div class="text-sm text-gray-500 dark:text-gray-400">教师数</div>
                <div class="text-2xl font-bold mt-1" x-text="stats.teachers ?? '—'"></div>
            </div>
            <div class="p-4 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
                <div class="text-sm text-gray-500 dark:text-gray-400">考试数</div>
                <div class="text-2xl font-bold mt-1" x-text="stats.exams ?? '—'"></div>
            </div>
        </div>
    </div>

    <!-- 快速入口 -->
    <div class="card">
        <div class="card-header"><h2 class="text-lg font-semibold">快速入口</h2></div>
        <div class="card-body grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
            <a href="/page/scores/score_entry" class="btn btn-primary">成绩录入</a>
            <a href="/page/students/student_list" class="btn btn-secondary">学生管理</a>
            <a href="/page/exams/exam_manage" class="btn btn-secondary">考试管理</a>
            <a href="/page/students/student_register" class="btn btn-secondary">新生注册</a>
            <a href="/page/teachers/teacher_assign" class="btn btn-secondary">任课安排</a>
            <a href="/page/system/system_config" class="btn btn-secondary">系统设置</a>
        </div>
    </div>

    <!-- 学期状态 -->
    <div class="card">
        <div class="card-header"><h2 class="text-lg font-semibold">学期状态</h2></div>
        <div class="card-body space-y-2 text-sm">
            <div class="flex justify-between border-b border-gray-200 dark:border-gray-700 pb-2">
                <span class="text-gray-500 dark:text-gray-400">学期 ID</span>
                <span x-text="semester?.id ?? '—'"></span>
            </div>
            <div class="flex justify-between border-b border-gray-200 dark:border-gray-700 pb-2">
                <span class="text-gray-500 dark:text-gray-400">学年度</span>
                <span x-text="semester?.year_start ? (semester.year_start + '-' + (semester.year_start + 1)) : '—'"></span>
            </div>
            <div class="flex justify-between border-b border-gray-200 dark:border-gray-700 pb-2">
                <span class="text-gray-500 dark:text-gray-400">状态</span>
                <span class="badge" :class="semester?.is_active ? 'badge-success' : 'badge-default'" x-text="semester?.is_active ? '激活' : '非激活'"></span>
            </div>
            <div class="flex justify-between">
                <span class="text-gray-500 dark:text-gray-400">开始 / 结束</span>
                <span x-text="semester?.start_date ? (formatDate(semester.start_date) + ' ~ ' + (semester.end_date ? formatDate(semester.end_date) : '—')) : '—'"></span>
            </div>
        </div>
    </div>

    <!-- 数据看板图表区（第四阶段） -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4" x-show="dashLoaded">
        <div class="card">
            <div class="card-header"><h2 class="text-lg font-semibold">学生性别构成</h2></div>
            <div class="card-body">
                <div id="gender-chart" class="w-full h-64"></div>
            </div>
        </div>
        <div class="card">
            <div class="card-header"><h2 class="text-lg font-semibold">班级人数</h2></div>
            <div class="card-body">
                <div id="class-chart" class="w-full h-64"></div>
            </div>
        </div>
        <div class="card lg:col-span-2">
            <div class="card-header"><h2 class="text-lg font-semibold">成绩分段分布</h2></div>
            <div class="card-body">
                <div id="score-chart" class="w-full h-56"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    function overviewStats() {
        return {
            stats: {},
            semester: null,
            dashLoaded: false,
            async init() {
                await this.loadStats();
                await this.loadSemester();
                await this.loadDashboard();
            },
            async loadStats() {
                try {
                    const resp = await fetch('/api/stats/current', { credentials: 'include', headers: authHeaders() });
                    if (resp.ok) this.stats = await resp.json();
                } catch (e) { console.warn('Failed to load stats:', e); }
            },
            async loadSemester() {
                try {
                    const resp = await fetch('/api/semester/active', { credentials: 'include', headers: authHeaders() });
                    if (resp.ok) {
                        const data = await resp.json();
                        this.semester = data.semester || data;
                    }
                } catch (e) { console.warn('Failed to load semester:', e); }
            },
            async loadDashboard() {
                try {
                    const resp = await fetch('/api/stats/dashboard', { credentials: 'include', headers: authHeaders() });
                    if (!resp.ok) return;
                    const d = await resp.json();
                    this.renderCharts(d);
                    this.dashLoaded = true;
                } catch (e) { console.warn('Failed to load dashboard:', e); }
            },
            renderCharts(d) {
                const baseTheme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
                const colors = { light: ['#3498DB', '#E74C3C', '#95A5A6', '#27AE60', '#E67E22', '#8E44AD'], dark: ['#4ea8de', '#ff6b6b', '#6c757d', '#3ddc84', '#ffa94d', '#b197fc'] };
                const c = colors[baseTheme];
                // 性别饼图
                const genderEl = document.getElementById('gender-chart');
                if (genderEl && window.echarts) {
                    const chart = echarts.init(genderEl);
                    chart.setOption({
                        tooltip: { trigger: 'item' },
                        legend: { bottom: 0 },
                        series: [{
                            type: 'pie', radius: ['35%', '65%'], avoidLabelOverlap: true,
                            label: { show: true, formatter: '{b}: {c} ({d}%)' },
                            data: (d.gender || []).filter(g => g.value > 0).map((g, i) => ({ name: g.name, value: g.value, itemStyle: { color: c[i % c.length] } }))
                        }]
                    });
                }
                // 班级人数柱状图
                const classEl = document.getElementById('class-chart');
                if (classEl && window.echarts) {
                    const chart = echarts.init(classEl);
                    chart.setOption({
                        tooltip: { trigger: 'axis' },
                        grid: { left: 40, right: 16, top: 16, bottom: 32 },
                        xAxis: { type: 'category', data: (d.class_sizes || []).map(x => x.name), axisLabel: { interval: 0, rotate: 30 } },
                        yAxis: { type: 'value', minInterval: 1 },
                        series: [{ type: 'bar', data: (d.class_sizes || []).map(x => x.count), itemStyle: { color: c[0], borderRadius: [4, 4, 0, 0] }, barMaxWidth: 40 }]
                    });
                }
                // 成绩分段分布
                const scoreEl = document.getElementById('score-chart');
                if (scoreEl && window.echarts) {
                    const chart = echarts.init(scoreEl);
                    chart.setOption({
                        tooltip: { trigger: 'axis' },
                        grid: { left: 40, right: 16, top: 16, bottom: 32 },
                        xAxis: { type: 'category', data: (d.score_dist || []).map(x => x.name) },
                        yAxis: { type: 'value', minInterval: 1 },
                        series: [{ type: 'bar', data: (d.score_dist || []).map(x => x.value), itemStyle: { color: c[2], borderRadius: [4, 4, 0, 0] }, barMaxWidth: 40 }]
                    });
                }
            }
        };
    }
</script>
{% endblock %}
