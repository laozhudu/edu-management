{% extends "base.html" %}

{% block title %}登录 - {% endblock %}

{% block extra_head %}
<!-- 登录页面专用样式 -->
<style>
    /* 登录页面特有样式 */
</style>
{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900 px-4 py-12">
    <div class="max-w-md w-full space-y-8 p-8 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700" x-data="loginForm">
        <div class="text-center">
            <h1 class="text-3xl font-bold text-gray-900 dark:text-white">
                {% if config.app.school_name %}{{ config.app.school_name }}{% else %}教务管理系统{% endif %}
            </h1>
            <h2 class="mt-2 text-lg text-gray-600 dark:text-gray-400">登录系统</h2>
        </div>
        
        <form class="mt-8 space-y-6" id="login-form" @submit.prevent="handleLogin">
            <div class="space-y-4">
                <div>
                    <label for="username" class="sr-only">用户名</label>
                    <input 
                        id="username" 
                        name="username" 
                        type="text" 
                        autocomplete="username" 
                        required
                        x-model="form.username"
                        @keydown.enter="handleLogin"
                        class="appearance-none rounded-lg relative block w-full px-4 py-3 border border-gray-300 dark:border-gray-600 placeholder-gray-500 dark:placeholder-gray-400 text-gray-900 dark:text-white bg-white dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-colors"
                        placeholder="用户名"
                        autocomplete="username"
                    >
                </div>
                
                <div>
                    <label for="password" class="sr-only">密码</label>
                    <input 
                        id="password" 
                        name="password" 
                        type="password" 
                        autocomplete="current-password" 
                        required
                        x-model="form.password"
                        @keydown.enter="handleLogin"
                        class="appearance-none rounded-lg relative block w-full px-4 py-3 border border-gray-300 dark:border-gray-600 placeholder-gray-500 dark:placeholder-gray-400 text-gray-900 dark:text-white bg-white dark:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-colors"
                        placeholder="密码"
                        autocomplete="current-password"
                    >
                </div>
            </div>
            
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input 
                        id="remember" 
                        name="remember" 
                        type="checkbox" 
                        x-model="form.remember"
                        class="h-4 w-4 text-primary-600 border-gray-300 dark:border-gray-600 rounded focus:ring-primary-500 focus:ring-2"
                    >
                    <label for="remember" class="ml-2 block text-sm text-gray-900 dark:text-gray-300">
                        记住我
                    </label>
                </div>
                <div class="flex items-center">
                    <input 
                        id="auto_login" 
                        name="auto_login" 
                        type="checkbox" 
                        x-model="form.auto_login"
                        class="h-4 w-4 text-primary-600 border-gray-300 dark:border-gray-600 rounded focus:ring-primary-500 focus:ring-2"
                    >
                    <label for="auto_login" class="ml-2 block text-sm text-gray-900 dark:text-gray-300">
                        自动登录
                    </label>
                </div>
            </div>
            
            <div>
                <button 
                    type="submit"
                    :disabled="loading"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                >
                    <span x-show="!loading">登录</span>
                    <span x-show="loading" class="flex items-center">
                        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        登录中...
                    </span>
                </button>
            </div>
        </form>
        
        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600 dark:text-gray-400">
                版本: <span id="version-tag">v2.0.0</span>
            </p>
        </div>
    </div>
</div>

<!-- 全局错误提示 -->
<div x-data="{ error: null }" 
     x-init="$watch('\$store.error', v => { if(v) this.error = v; })"
     x-show="error"
     class="fixed top-4 right-4 z-50 animate-slide-in"
     style="display: none;">
    <div x-show="error" class="bg-red-500 text-white px-4 py-3 rounded-lg shadow-lg flex items-center justify-between min-w-[300px] max-w-md">
        <span x-text="error"></span>
        <button @click="error = null" class="ml-4 text-white hover:text-gray-200">×</button>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<!-- 登录页面专用脚本 - 必须在 Alpine.js 之后加载以注册组件 -->
<script>
document.addEventListener('alpine:init', () => {
    // 全局错误存储
    Alpine.store('error', null);
    
    // 监听全局错误事件
    window.addEventListener('notify', (e) => {
        Alpine.store('error', e.detail.message);
    });

    // 认证头辅助函数（供全局使用）
    window.authHeaders = function() {
        const token = localStorage.getItem('access_token');
        return token ? { 'Authorization': 'Bearer ' + token } : {};
    };

    Alpine.data('loginForm', () => ({
        form: {
            username: '',
            password: '',
            remember: false,
            auto_login: false
        },
        loading: false,
        error: null,
        
        async handleLogin(e) {
            e.preventDefault();
            this.error = null;
            this.loading = true;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify(this.form)
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || '登录失败');
                }
                
                // 登录成功，保存 token
                if (data.access_token) {
                    // Token 存 localStorage（页面 fetch 时通过 Authorization header 携带）
                    localStorage.setItem('access_token', data.access_token);
                    if (data.user) {
                        localStorage.setItem('user', JSON.stringify(data.user));
                    }
                }
                
                // 登录成功，跳转到主页
                window.location.href = '/';
                
            } catch (error) {
                this.error = error.message;
            } finally {
                this.loading = false;
            }
        },
        
        // 处理回车键
        handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                this.handleLogin(new Event('submit'));
            }
        }
    }));
    
    // 全局错误处理
    window.addEventListener('error', (e) => {
        console.error('Login page error:', e.error);
    });
    
    window.addEventListener('unhandledrejection', (e) => {
        console.error('Unhandled rejection:', e.reason);
    });
});
</script>
{% endblock %}
