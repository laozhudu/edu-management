{% extends "base.html" %}

{% block title %}登录 - {% endblock %}

{% block extra_head %}
<!-- 登录页面专用样式 -->
<style>
    /* 登录页面特有样式 */
</style>
{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center relative overflow-hidden"
     style="background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 40%, #409EFF 100%);">
    <!-- 装饰光斑 -->
    <div class="absolute -top-24 -left-24 w-96 h-96 rounded-full opacity-30" style="background: radial-gradient(circle, #60a5fa 0%, transparent 70%);"></div>
    <div class="absolute -bottom-32 -right-24 w-[30rem] h-[30rem] rounded-full opacity-20" style="background: radial-gradient(circle, #93c5fd 0%, transparent 70%);"></div>

    <div class="relative z-10 max-w-md w-full px-6"
         x-data="loginForm">
        <div class="bg-white/95 dark:bg-gray-900/90 backdrop-blur-xl rounded-2xl shadow-2xl overflow-hidden">
            <!-- 品牌区 -->
            <div class="px-8 pt-8 pb-6 text-center bg-gradient-to-b from-primary-50/60 to-transparent dark:from-primary-900/20">
                <div class="w-16 h-16 mx-auto mb-4 rounded-2xl flex items-center justify-center text-3xl text-white shadow-lg"
                     style="background: linear-gradient(135deg, #409EFF 0%, #337ecc 100%);">
                    <i class="fa fa-graduation-cap"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white">
                    {% if config.app.school_name %}{{ config.app.school_name }}{% else %}教务管理系统{% endif %}
                </h1>
                <p class="mt-1.5 text-sm text-gray-500 dark:text-gray-400">登录系统</p>
            </div>

            <!-- 表单区 -->
            <div class="px-8 pb-8">
                <form class="mt-4 space-y-5" id="login-form" @submit.prevent="handleLogin">
                    <div>
                        <label for="username" class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1.5">用户名</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-3 flex items-center text-gray-400"><i class="fa fa-user"></i></span>
                            <input id="username" name="username" type="text" autocomplete="username" required
                                   x-model="form.username" @keydown.enter="handleLogin"
                                   class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-800 placeholder-gray-400 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all"
                                   placeholder="请输入用户名">
                        </div>
                    </div>
                    <div>
                        <label for="password" class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1.5">密码</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-3 flex items-center text-gray-400"><i class="fa fa-lock"></i></span>
                            <input id="password" name="password" type="password" autocomplete="current-password" required
                                   x-model="form.password" @keydown.enter="handleLogin"
                                   class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 dark:border-gray-600 dark:bg-gray-800 placeholder-gray-400 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all"
                                   placeholder="请输入密码">
                        </div>
                    </div>

                    <div class="flex items-center justify-between text-sm">
                        <label class="flex items-center cursor-pointer">
                            <input id="remember" name="remember" type="checkbox" x-model="form.remember"
                                   class="h-4 w-4 text-primary-600 rounded focus:ring-primary-500">
                            <span class="ml-2 text-gray-600 dark:text-gray-300">记住我</span>
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <input id="auto_login" name="auto_login" type="checkbox" x-model="form.auto_login"
                                   class="h-4 w-4 text-primary-600 rounded focus:ring-primary-500">
                            <span class="ml-2 text-gray-600 dark:text-gray-300">自动登录</span>
                        </label>
                    </div>

                    <button type="submit" :disabled="loading"
                            class="w-full py-2.5 rounded-lg text-white font-medium text-sm transition-all disabled:opacity-60"
                            style="background: linear-gradient(135deg, #409EFF 0%, #337ecc 100%); box-shadow: 0 4px 12px rgba(64,158,255,0.3);"
                            :class="{ 'opacity-70': loading }">
                        <span x-show="!loading"><i class="fa fa-sign-in-alt mr-1.5"></i>登 录</span>
                        <span x-show="loading"><i class="fa fa-spinner fa-spin mr-1.5"></i>登录中...</span>
                    </button>
                </form>

                <div class="mt-6 text-center">
                    <p class="text-xs text-gray-400">
                        版本: <span id="version-tag">v2.0.0</span>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 全局错误提示 -->
<div x-data="{ error: null }" 
     x-init="$watch('\$store.error', v => { if(v) this.error = v; })"
     x-show="error"
     class="fixed top-4 right-4 z-50 animate-slide-in"
     style="display: none;">
    <div x-show="error" class="bg-red-500 text-white px-4 py-3 rounded-lg shadow-lg flex items-center justify-between min-w-[300px] max-w-md">
        <span x-text="error"></span>
        <button @click="error = null" class="ml-4 text-white hover:text-gray-200">×</button>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<!-- 登录页面专用脚本 - 必须在 Alpine.js 之后加载以注册组件 -->
<script>
document.addEventListener('alpine:init', () => {
    // 全局错误存储（初始化失败不能阻断后续组件注册）
    try {
        Alpine.store('error', '');
    } catch (e) {
        console.warn('Alpine.store init error:', e);
    }
    
    // 监听全局错误事件
    window.addEventListener('notify', (e) => {
        try {
            Alpine.store('error', e.detail.message);
        } catch (_) {}
    });

    // 认证头辅助函数（供全局使用）
    window.authHeaders = function() {
        const token = localStorage.getItem('access_token');
        return token ? { 'Authorization': 'Bearer ' + token } : {};
    };

    Alpine.data('loginForm', () => ({
        form: {
            username: '',
            password: '',
            remember: false,
            auto_login: false
        },
        loading: false,
        error: null,
        
        async handleLogin(e) {
            e.preventDefault();
            this.error = null;
            this.loading = true;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify(this.form)
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || '登录失败');
                }
                
                // 登录成功，保存 token
                if (data.access_token) {
                    // Token 存 localStorage（页面 fetch 时通过 Authorization header 携带）
                    localStorage.setItem('access_token', data.access_token);
                    if (data.user) {
                        localStorage.setItem('user', JSON.stringify(data.user));
                    }
                }
                
                // 登录成功，跳转到主页
                window.location.href = '/';
                
            } catch (error) {
                this.error = error.message;
            } finally {
                this.loading = false;
            }
        },
        
        // 处理回车键
        handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                this.handleLogin(new Event('submit'));
            }
        }
    }));
    
    // 全局错误处理
    window.addEventListener('error', (e) => {
        console.error('Login page error:', e.error);
    });
    
    window.addEventListener('unhandledrejection', (e) => {
        console.error('Unhandled rejection:', e.reason);
    });
});
</script>
{% endblock %}
