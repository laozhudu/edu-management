<!-- 教室位置页（P3-A5 双端一致：显示班级→教室映射） -->
{% extends "index.html" %}

{% block title %}教室位置 - 教务管理系统{% endblock %}

{% block content %}
<div class="space-y-4 max-w-6xl mx-auto px-4" x-data="classroomList()">
    <!-- 统计卡片 -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="card">
            <div class="card-body">
                <div class="text-sm text-gray-500 dark:text-gray-400">班级总数</div>
                <div class="text-2xl font-bold mt-1" x-text="classes.length"></div>
            </div>
        </div>
        <div class="card">
            <div class="card-body">
                <div class="text-sm text-gray-500 dark:text-gray-400">已分配教室</div>
                <div class="text-2xl font-bold mt-1" x-text="assignedCount()"></div>
            </div>
        </div>
        <div class="card">
            <div class="card-body">
                <div class="text-sm text-gray-500 dark:text-gray-400">待分配教室</div>
                <div class="text-2xl font-bold mt-1" x-text="unassignedCount()"></div>
            </div>
        </div>
    </div>

    <!-- 教室列表 -->
    <div class="card">
        <div class="card-header flex items-center justify-between">
            <h2 class="text-lg font-semibold">教室分配（按班级）</h2>
            <div class="flex items-center gap-2">
                <input type="text" class="input input-sm w-48" placeholder="搜索班级/教室"
                       x-model="filters.keyword" @keydown.enter="applyFilter()">
                <button class="btn btn-secondary btn-sm" @click="load()">刷新</button>
            </div>
        </div>
        <div class="overflow-x-auto">
            <table class="table">
                <thead>
                    <tr>
                        <th>班级</th>
                        <th>年级</th>
                        <th>教室</th>
                        <th>班主任</th>
                        <th>座位数</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="c in filteredClasses()" :key="c.id">
                        <tr>
                            <td class="font-medium" x-text="c.name"></td>
                            <td x-text="c.grade_name || '—'"></td>
                            <td x-text="c.room || '—'"></td>
                            <td x-text="c.head_teacher || '—'"></td>
                            <td x-text="c.capacity || '—'"></td>
                            <td class="whitespace-nowrap">
                                <button class="btn btn-ghost btn-sm" @click="openEditRoom(c)">改教室</button>
                            </td>
                        </tr>
                    </template>
                    <tr x-show="!loading && classes.length === 0">
                        <td colspan="6" class="text-center py-8 text-gray-500 dark:text-gray-400">暂无班级数据</td>
                    </tr>
                    <tr x-show="loading">
                        <td colspan="6" class="py-8"><div class="skeleton-text w-2/3 mx-auto"></div></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    function classroomList() {
        return {
            classes: [],
            loading: false,
            filters: { keyword: '' },

            async load() {
                this.loading = true;
                try {
                    const resp = await fetch('/api/class?page_size=500', {
                        credentials: 'include', headers: authHeaders()
                    });
                    if (resp.ok) {
                        const d = await resp.json();
                        this.classes = d.items || [];
                    } else if (resp.status === 401) {
                        window.location.href = '/login';
                    }
                } catch (e) {
                    console.error('加载班级失败:', e);
                } finally {
                    this.loading = false;
                }
            },

            assignedCount() {
                return this.classes.filter(c => c.room).length;
            },

            unassignedCount() {
                return this.classes.filter(c => !c.room).length;
            },

            filteredClasses() {
                const kw = (this.filters.keyword || '').trim().toLowerCase();
                if (!kw) return this.classes;
                return this.classes.filter(c =>
                    (c.name || '').toLowerCase().includes(kw) ||
                    (c.room || '').toLowerCase().includes(kw)
                );
            },

            async openEditRoom(c) {
                const room = prompt('为「' + c.name + '」设置教室（原值: ' + (c.room || '未设置') + '）', c.room || '');
                if (room === null) return;
                try {
                    const resp = await fetch('/api/class/' + c.id, {
                        method: 'PUT',
                        credentials: 'include',
                        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
                        body: JSON.stringify({ room })
                    });
                    if (resp.ok) {
                        this.load();
                    } else {
                        const d = await resp.json().catch(() => ({}));
                        alert(d.detail || '设置失败');
                    }
                } catch (e) { alert('设置失败: ' + e.message); }
            },

            init() { this.load(); }
        };
    }
</script>
{% endblock %}
