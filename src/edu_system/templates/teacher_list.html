<!-- 教师管理页（M5-G 双端一致：Web 端） -->
{% extends "index.html" %}

{% block title %}教师管理 - 教务管理系统{% endblock %}

{% block content %}
<div class="space-y-4" x-data="teacherManage()">
    <!-- 工具栏 -->
    <div class="card">
        <div class="card-body flex flex-wrap gap-3 items-end">
            <div class="min-w-[200px] flex-1">
                <label class="label" for="teacher-kw">关键字</label>
                <input id="teacher-kw" type="text" class="input" placeholder="姓名/工号"
                       x-model="filters.keyword" @keydown.enter="load(1)">
            </div>
            <div>
                <label class="label" for="title">职称</label>
                <select id="title" class="select w-32" x-model="filters.title" @change="load(1)">
                    <option value="">全部</option>
                    <option value="正高级">正高级</option>
                    <option value="高级">高级</option>
                    <option value="中级">中级</option>
                    <option value="初级">初级</option>
                    <option value="无">无</option>
                </select>
            </div>
            <button class="btn btn-primary" @click="load(1)">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                查询
            </button>
            <button class="btn btn-secondary" @click="resetFilters()">重置</button>
        </div>
    </div>

    <!-- 教师列表 -->
    <div class="card">
        <div class="overflow-x-auto">
            <table class="table">
                <thead>
                    <tr>
                        <th>工号</th>
                        <th>姓名</th>
                        <th>性别</th>
                        <th>职称</th>
                        <th>学历/学位</th>
                        <th>电话</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="t in list" :key="t.id">
                        <tr>
                            <td x-text="t.staff_no || '—'"></td>
                            <td class="font-medium" x-text="t.name"></td>
                            <td x-text="t.gender || '—'"></td>
                            <td><span class="badge badge-primary" x-text="t.title || '—'"></span></td>
                            <td x-text="(t.education || '') + '/' + (t.degree || '')"></td>
                            <td x-text="t.phone || '—'"></td>
                            <td>
                                <button class="btn btn-ghost btn-sm" @click="viewDetail(t)">任课</button>
                            </td>
                        </tr>
                    </template>
                    <tr x-show="!loading && list.length === 0">
                        <td colspan="7" class="text-center py-8 text-gray-500 dark:text-gray-400">
                            暂无教师数据
                        </td>
                    </tr>
                    <tr x-show="loading">
                        <td colspan="7" class="py-8"><div class="skeleton-text w-2/3 mx-auto"></div></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer flex items-center justify-between">
            <div class="text-sm text-gray-500 dark:text-gray-400">
                共 <span x-text="total"></span> 条 · 第 <span x-text="page"></span>/<span x-text="totalPages()"></span> 页
            </div>
            <div class="pagination">
                <button class="pagination-btn" :disabled="page <= 1" @click="load(page-1)">上一页</button>
                <button class="pagination-btn" :disabled="page >= totalPages()" @click="load(page+1)">下一页</button>
            </div>
        </div>
    </div>

    <!-- 任课详情模态框 -->
    <div class="modal-overlay" x-show="detail" @click.self="detail = null" x-cloak>
        <div class="modal">
            <div class="modal-header">
                <h3 class="text-lg font-semibold" x-text="detail?.name + ' 的任课安排'"></h3>
                <button class="btn btn-ghost btn-sm" @click="detail = null">×</button>
            </div>
            <div class="modal-body">
                <div x-show="!detailAssignments.length">
                    <p class="text-center py-8 text-gray-500 dark:text-gray-400">暂无任课安排</p>
                </div>
                <table class="table" x-show="detailAssignments.length > 0">
                    <thead>
                        <tr>
                            <th>科目</th>
                            <th>班级</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="a in detailAssignments" :key="a.id">
                            <tr>
                                <td x-text="a.name"></td>
                                <td x-text="a.class_name || '—'"></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" @click="detail = null">关闭</button>
            </div>
        </div>
    </div>
</div>

<script>
    function teacherManage() {
        return {
            list: [],
            total: 0,
            page: 1,
            pageSize: 20,
            loading: false,
            filters: { keyword: '', title: '' },
            detail: null,
            detailAssignments: [],
            
            async load(p) {
                this.page = p || 1;
                this.loading = true;
                try {
                    const params = new URLSearchParams({
                        page: this.page,
                        page_size: this.pageSize,
                        ...this.filters
                    });
                    const resp = await fetch('/api/teachers?' + params, {
                        credentials: 'include', headers: authHeaders()
                    });
                    if (resp.ok) {
                        const d = await resp.json();
                        this.list = d.items || [];
                        this.total = d.total || 0;
                    } else if (resp.status === 401) {
                        window.location.href = '/login';
                    }
                } catch (e) {
                    console.error('加载教师列表失败:', e);
                } finally {
                    this.loading = false;
                }
            },
            
            resetFilters() {
                this.filters = { keyword: '', title: '' };
                this.load(1);
            },
            
            totalPages() {
                return Math.max(1, Math.ceil(this.total / this.pageSize));
            },
            
            async viewDetail(t) {
                try {
                    const resp = await fetch('/api/teachers/' + t.id + '/assignments', {
                        credentials: 'include', headers: authHeaders()
                    });
                    if (resp.ok) {
                        this.detail = t;
                        this.detailAssignments = (await resp.json()).assignments || [];
                    } else if (resp.status === 401) {
                        window.location.href = '/login';
                    }
                } catch (e) {
                    console.error('加载任课失败:', e);
                }
            },
            
            init() {
                this.load(1);
            }
        };
    }
</script>
{% endblock %}
