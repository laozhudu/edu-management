<!-- 教师管理页（M5-G 双端一致：Web 端） -->
{% extends "index.html" %}

{% block title %}教师管理 - 教务管理系统{% endblock %}

{% block content %}
<div class="space-y-4" x-data="teacherManage()">
    <!-- 顶部标签栏 -->
    <div class="card">
        <div class="card-body p-0">
            <div class="tabs border-b border-gray-200 dark:border-gray-700" role="tablist">
                <button role="tab" 
                        :class="{ 'tab active': activeTab === 'list', 'tab': true }" 
                        @click="activeTab = 'list'"
                        aria-selected="true">教师列表</button>
                <button role="tab" 
                        :class="{ 'tab active': activeTab === 'assign', 'tab': true }" 
                        @click="activeTab = 'assign'"
                        aria-selected="false">任课分配</button>
                <button role="tab" 
                        :class="{ 'tab active': activeTab === 'workload', 'tab': true }" 
                        @click="activeTab = 'workload'"
                        aria-selected="false">工作量</button>
            </div>
        </div>
    </div>

    <!-- 教师列表标签页 -->
    <div x-show="activeTab === 'list'" x-cloak>
        <div class="card">
            <div class="card-body flex flex-wrap gap-3 items-end p-4">
                <div class="min-w-[200px] flex-1">
                    <label class="label" for="teacher-kw">关键字</label>
                    <input id="teacher-kw" type="text" class="input" placeholder="姓名/工号"
                           x-model="filters.keyword" @keydown.enter="loadList(1)">
                </div>
                <div>
                    <label class="label" for="title">职称</label>
                    <select id="title" class="select w-32" x-model="filters.title" @change="loadList(1)">
                        <option value="">全部</option>
                        <option value="正高级">正高级</option>
                        <option value="高级">高级</option>
                        <option value="中级">中级</option>
                        <option value="初级">初级</option>
                        <option value="无">无</option>
                    </select>
                </div>
                <button class="btn btn-primary" @click="loadList(1)">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    查询
                </button>
                <button class="btn btn-secondary" @click="resetFilters()">重置</button>
                <button class="btn btn-primary" @click="openEdit(null)">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    新增教师
                </button>
            </div>
        </div>

        <div class="card mt-4">
            <div class="overflow-x-auto">
                <table class="table">
                    <thead>
                        <tr>
                            <th>工号</th>
                            <th>姓名</th>
                            <th>性别</th>
                            <th>职称</th>
                            <th>学历/学位</th>
                            <th>电话</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="t in teacherList" :key="t.id">
                            <tr>
                                <td x-text="t.staff_no || '—'"></td>
                                <td class="font-medium" x-text="t.name"></td>
                                <td x-text="t.gender || '—'"></td>
                                <td><span class="badge badge-primary" x-text="t.title || '—'"></span></td>
                                <td x-text="(t.education || '') + '/' + (t.degree || '')"></td>
                                <td x-text="t.phone || '—'"></td>
                                <td class="whitespace-nowrap">
                                    <button class="btn btn-ghost btn-sm" @click="openEdit(t.id)">编辑</button>
                                    <button class="btn btn-ghost btn-sm text-red-500" @click="remove(t.id, t.name)">删除</button>
                                </td>
                            </tr>
                        </template>
                        <tr x-show="!loadingList && teacherList.length === 0">
                            <td colspan="7" class="text-center py-8 text-gray-500 dark:text-gray-400">
                                暂无教师数据
                            </td>
                        </tr>
                        <tr x-show="loadingList">
                            <td colspan="7" class="py-8"><div class="skeleton-text w-2/3 mx-auto"></div></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer flex items-center justify-between">
                <div class="text-sm text-gray-500 dark:text-gray-400">
                    共 <span x-text="totalList"></span> 条 · 第 <span x-text="pageList"></span>/<span x-text="totalPagesList()"></span> 页
                </div>
                <div class="pagination">
                    <button class="pagination-btn" :disabled="pageList <= 1" @click="loadList(pageList-1)">上一页</button>
                    <button class="pagination-btn" :disabled="pageList >= totalPagesList()" @click="loadList(pageList+1)">下一页</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 任课分配标签页 -->
    <div x-show="activeTab === 'assign'" x-cloak>
        <div class="card">
            <div class="card-body flex flex-wrap gap-3 items-end p-4">
                <div class="min-w-[200px] flex-1">
                    <label class="label" for="assign-kw">关键字</label>
                    <input id="assign-kw" type="text" class="input" placeholder="教师姓名/工号/科目"
                           x-model="assignFilters.keyword" @keydown.enter="loadAssign(1)">
                </div>
                <div>
                    <label class="label" for="assign-subject">科目</label>
                    <select id="assign-subject" class="select w-40" x-model="assignFilters.subject_id" @change="loadAssign(1)">
                        <option value="">全部科目</option>
                        <template x-for="s in subjects" :key="s.id">
                            <option :value="s.id" x-text="s.name"></option>
                        </template>
                    </select>
                </div>
                <button class="btn btn-primary" @click="loadAssign(1)">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    查询
                </button>
                <button class="btn btn-secondary" @click="resetAssignFilters()">重置</button>
            </div>
        </div>

        <div class="card mt-4">
            <div class="overflow-x-auto">
                <table class="table">
                    <thead>
                        <tr>
                            <th>教师</th>
                            <th>工号</th>
                            <th>科目</th>
                            <th>班级</th>
                            <th>学期</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="a in assignList" :key="a.id">
                            <tr>
                                <td x-text="a.teacher_name"></td>
                                <td x-text="a.teacher_no"></td>
                                <td x-text="a.subject_name"></td>
                                <td x-text="a.class_name"></td>
                                <td x-text="a.semester_label"></td>
                            </tr>
                        </template>
                        <tr x-show="!loadingAssign && assignList.length === 0">
                            <td colspan="5" class="text-center py-8 text-gray-500 dark:text-gray-400">
                                暂无任课分配数据
                            </td>
                        </tr>
                        <tr x-show="loadingAssign">
                            <td colspan="5" class="py-8"><div class="skeleton-text w-2/3 mx-auto"></div></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer flex items-center justify-between">
                <div class="text-sm text-gray-500 dark:text-gray-400">
                    共 <span x-text="totalAssign"></span> 条 · 第 <span x-text="pageAssign"></span>/<span x-text="totalPagesAssign()"></span> 页
                </div>
                <div class="pagination">
                    <button class="pagination-btn" :disabled="pageAssign <= 1" @click="loadAssign(pageAssign-1)">上一页</button>
                    <button class="pagination-btn" :disabled="pageAssign >= totalPagesAssign()" @click="loadAssign(pageAssign+1)">下一页</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 工作量标签页 -->
    <div x-show="activeTab === 'workload'" x-cloak>
        <div class="card">
            <div class="card-body flex flex-wrap gap-3 items-end p-4">
                <div class="min-w-[200px] flex-1">
                    <label class="label" for="wl-kw">关键字</label>
                    <input id="wl-kw" type="text" class="input" placeholder="教师姓名/工号"
                           x-model="wlFilters.keyword" @keydown.enter="loadWorkload(1)">
                </div>
                <div>
                    <label class="label" for="wl-semester">学期</label>
                    <select id="wl-semester" class="select w-40" x-model="wlFilters.semester_id" @change="loadWorkload(1)">
                        <option value="">全部学期</option>
                        <template x-for="s in semesters" :key="s.id">
                            <option :value="s.id" x-text="s.label"></option>
                        </template>
                    </select>
                </div>
                <button class="btn btn-primary" @click="loadWorkload(1)">
                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    查询
                </button>
                <button class="btn btn-secondary" @click="resetWlFilters()">重置</button>
            </div>
        </div>

        <div class="card mt-4">
            <div class="overflow-x-auto">
                <table class="table">
                    <thead>
                        <tr>
                            <th>教师</th>
                            <th>工号</th>
                            <th>职称</th>
                            <th>任课门数</th>
                            <th>任课班数</th>
                            <th>总课时数</th>
                            <th>周课时数</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="w in workloadList" :key="w.teacher_id">
                            <tr>
                                <td class="font-medium" x-text="w.teacher_name"></td>
                                <td x-text="w.teacher_no"></td>
                                <td x-text="w.title"></td>
                                <td x-text="w.course_count"></td>
                                <td x-text="w.class_count"></td>
                                <td x-text="w.total_hours"></td>
                                <td x-text="w.weekly_hours"></td>
                            </tr>
                        </template>
                        <tr x-show="!loadingWl && workloadList.length === 0">
                            <td colspan="7" class="text-center py-8 text-gray-500 dark:text-gray-400">
                                暂无工作量数据
                            </td>
                        </tr>
                        <tr x-show="loadingWl">
                            <td colspan="7" class="py-8"><div class="skeleton-text w-2/3 mx-auto"></div></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer flex items-center justify-between">
                <div class="text-sm text-gray-500 dark:text-gray-400">
                    共 <span x-text="totalWl"></span> 条 · 第 <span x-text="pageWl"></span>/<span x-text="totalPagesWl()"></span> 页
                </div>
                <div class="pagination">
                    <button class="pagination-btn" :disabled="pageWl <= 1" @click="loadWorkload(pageWl-1)">上一页</button>
                    <button class="pagination-btn" :disabled="pageWl >= totalPagesWl()" @click="loadWorkload(pageWl+1)">下一页</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 新增/编辑教师对话框 -->
    <div x-show="showEditor" class="fixed inset-0 z-50 flex items-center justify-center bg-black/30 p-4"
         @click.away="showEditor = false">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-xl w-full max-w-md p-6">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4"
                x-text="editingId ? '编辑教师' : '新增教师'"></h3>
            <div class="space-y-3">
                <div>
                    <label class="label" for="edit-name">姓名 *</label>
                    <input id="edit-name" type="text" class="input" x-model="editForm.name" placeholder="教师姓名">
                </div>
                <div>
                    <label class="label" for="edit-no">工号</label>
                    <input id="edit-no" type="text" class="input" x-model="editForm.staff_no" placeholder="工号/编号">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="label" for="edit-gender">性别</label>
                        <select id="edit-gender" class="select w-full" x-model="editForm.gender">
                            <option value="">—</option>
                            <option value="男">男</option>
                            <option value="女">女</option>
                        </select>
                    </div>
                    <div>
                        <label class="label" for="edit-title">职称</label>
                        <select id="edit-title" class="select w-full" x-model="editForm.title">
                            <option value="">—</option>
                            <option value="正高级">正高级</option>
                            <option value="高级">高级</option>
                            <option value="中级">中级</option>
                            <option value="初级">初级</option>
                            <option value="无">无</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="label" for="edit-phone">电话</label>
                    <input id="edit-phone" type="text" class="input" x-model="editForm.phone" placeholder="联系电话">
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-2">
                <button class="btn btn-secondary" @click="showEditor = false">取消</button>
                <button class="btn btn-primary" @click="save()" :disabled="saving">
                    <span x-show="!saving">保存</span>
                    <span x-show="saving">保存中...</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function teacherManage() {
        return {
            activeTab: 'list',  // list | assign | workload
            // --- 教师编辑 ---
            showEditor: false,
            editingId: null,
            editForm: { name: '', staff_no: '', gender: '', title: '', phone: '' },
            saving: false,
            
            // --- 教师列表 ---
            teacherList: [],
            totalList: 0,
            pageList: 1,
            pageSizeList: 20,
            loadingList: false,
            listFilters: { keyword: '', title: '' },
            
            // --- 任课分配 ---
            assignList: [],
            totalAssign: 0,
            pageAssign: 1,
            pageSizeAssign: 20,
            loadingAssign: false,
            assignFilters: { keyword: '', subject_id: '' },
            subjects: [],
            
            // --- 工作量 ---
            workloadList: [],
            totalWl: 0,
            pageWl: 1,
            pageSizeWl: 20,
            loadingWl: false,
            wlFilters: { keyword: '', semester_id: '' },
            semesters: [],

            openEdit(id) {
                this.editingId = id;
                if (id) {
                    const t = this.teacherList.find(x => x.id === id);
                    this.editForm = {
                        name: t?.name || '', staff_no: t?.staff_no || '',
                        gender: t?.gender || '', title: t?.title || '', phone: t?.phone || ''
                    };
                } else {
                    this.editForm = { name: '', staff_no: '', gender: '', title: '', phone: '' };
                }
                this.showEditor = true;
            },

            async save() {
                if (!this.editForm.name) {
                    alert('教师姓名不能为空');
                    return;
                }
                this.saving = true;
                try {
                    const url = this.editingId ? `/api/teachers/${this.editingId}` : '/api/teachers';
                    const method = this.editingId ? 'PUT' : 'POST';
                    const resp = await fetch(url, {
                        method,
                        credentials: 'include',
                        headers: { ...authHeaders(), 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.editForm)
                    });
                    if (resp.ok || resp.status === 201) {
                        this.showEditor = false;
                        this.loadList(this.pageList);
                    } else {
                        const d = await resp.json().catch(() => ({}));
                        alert(d.detail || '保存失败');
                    }
                } catch (e) {
                    console.error('保存教师失败:', e);
                    alert('保存失败: ' + e.message);
                } finally {
                    this.saving = false;
                }
            },

            async remove(id, name) {
                if (!confirm(`确定删除教师「${name}」？`)) return;
                try {
                    const resp = await fetch(`/api/teachers/${id}`, {
                        method: 'DELETE',
                        credentials: 'include',
                        headers: authHeaders()
                    });
                    if (resp.ok) {
                        this.loadList(this.pageList);
                    } else {
                        const d = await resp.json().catch(() => ({}));
                        alert(d.detail || '删除失败');
                    }
                } catch (e) {
                    console.error('删除教师失败:', e);
                    alert('删除失败: ' + e.message);
                }
            },

            async loadList(p) {
                this.pageList = p || 1;
                this.loadingList = true;
                try {
                    const params = new URLSearchParams({
                        page: this.pageList,
                        page_size: this.pageSizeList,
                        ...this.listFilters
                    });
                    const resp = await fetch('/api/teachers?' + params, {
                        credentials: 'include', headers: authHeaders()
                    });
                    if (resp.ok) {
                        const d = await resp.json();
                        this.teacherList = d.items || [];
                        this.totalList = d.total || 0;
                    } else if (resp.status === 401) {
                        window.location.href = '/login';
                    }
                } catch (e) {
                    console.error('加载教师列表失败:', e);
                } finally {
                    this.loadingList = false;
                }
            },
            
            async loadAssign(p) {
                this.pageAssign = p || 1;
                this.loadingAssign = true;
                try {
                    const params = new URLSearchParams({
                        page: this.pageAssign,
                        page_size: this.pageSizeAssign,
                        ...this.assignFilters
                    });
                    const resp = await fetch('/api/teachers/assignments?' + params, {
                        credentials: 'include', headers: authHeaders()
                    });
                    if (resp.ok) {
                        const d = await resp.json();
                        this.assignList = d.items || [];
                        this.totalAssign = d.total || 0;
                    } else if (resp.status === 401) {
                        window.location.href = '/login';
                    }
                } catch (e) {
                    console.error('加载任课分配失败:', e);
                } finally {
                    this.loadingAssign = false;
                }
            },
            
            async loadWorkload(p) {
                this.pageWl = p || 1;
                this.loadingWl = true;
                try {
                    const params = new URLSearchParams({
                        page: this.pageWl,
                        page_size: this.pageSizeWl,
                        ...this.wlFilters
                    });
                    const resp = await fetch('/api/teachers/workload?' + params, {
                        credentials: 'include', headers: authHeaders()
                    });
                    if (resp.ok) {
                        const d = await resp.json();
                        this.workloadList = d.items || [];
                        this.totalWl = d.total || 0;
                    } else if (resp.status === 401) {
                        window.location.href = '/login';
                    }
                } catch (e) {
                    console.error('加载工作量失败:', e);
                } finally {
                    this.loadingWl = false;
                }
            },
            
            async loadSubjects() {
                try {
                    const resp = await fetch('/api/subjects?page_size=100', {
                        credentials: 'include', headers: authHeaders()
                    });
                    if (resp.ok) {
                        this.subjects = (await resp.json()).items || [];
                    }
                } catch (e) {
                    console.error('加载科目失败:', e);
                }
            },
            
            async loadSemesters() {
                try {
                    const resp = await fetch('/api/semesters?page_size=100', {
                        credentials: 'include', headers: authHeaders()
                    });
                    if (resp.ok) {
                        this.semesters = (await resp.json()).items || [];
                    }
                } catch (e) {
                    console.error('加载学期失败:', e);
                }
            },
            
            resetFilters() {
                this.listFilters = { keyword: '', title: '' };
                this.loadList(1);
            },
            
            resetAssignFilters() {
                this.assignFilters = { keyword: '', subject_id: '' };
                this.loadAssign(1);
            },
            
            resetWlFilters() {
                this.wlFilters = { keyword: '', semester_id: '' };
                this.loadWorkload(1);
            },
            
            totalPagesList() { return Math.max(1, Math.ceil(this.totalList / this.pageSizeList)); },
            totalPagesAssign() { return Math.max(1, Math.ceil(this.totalAssign / this.pageSizeAssign)); },
            totalPagesWl() { return Math.max(1, Math.ceil(this.totalWl / this.pageSizeWl)); },
            
            init() {
                this.loadSubjects();
                this.loadSemesters();
                this.loadList(1);
                this.loadAssign(1);
                this.loadWorkload(1);
            }
        };
    }
</script>
{% endblock %}
