<!-- 部门管理页（B5：对齐若依 sys_dept 树形） -->
{% extends "index.html" %}

{% block title %}部门管理 - 教务管理系统{% endblock %}

{% block content %}
<div class="space-y-4 max-w-4xl mx-auto px-4" x-data="deptManager()">
    <div class="card">
        <div class="card-header flex items-center justify-between">
            <h2 class="text-lg font-semibold">部门管理</h2>
            <div class="flex gap-2">
                <button class="btn btn-primary btn-sm" @click="openAdd()">新增部门</button>
                <button class="btn btn-secondary btn-sm" @click="load()">刷新</button>
            </div>
        </div>
        <div class="card-body">
            <div class="border rounded-lg overflow-x-auto">
                <table class="table">
                    <thead>
                        <tr><th>部门名称</th><th>负责人</th><th>联系电话</th><th>状态</th><th>操作</th></tr>
                    </thead>
                    <tbody>
                        <template x-for="d in flat" :key="d.id">
                            <tr>
                                <td class="font-medium" x-text="'　'.repeat(d.level) + d.dept_name"></td>
                                <td x-text="d.leader"></td>
                                <td x-text="d.phone"></td>
                                <td><span class="badge" :class="d.status === '0' ? 'badge-success' : 'badge-danger'" x-text="d.status === '0' ? '正常' : '停用'"></span></td>
                                <td class="whitespace-nowrap">
                                    <button class="text-blue-500 hover:underline text-xs mr-2" @click="openAdd(d.id)">新增下级</button>
                                    <button class="text-blue-500 hover:underline text-xs mr-2" @click="openEdit(d)">编辑</button>
                                    <button class="text-red-500 hover:underline text-xs" @click="remove(d)">删除</button>
                                </td>
                            </tr>
                        </template>
                        <tr x-show="!flat.length">
                            <td colspan="5" class="text-center py-6 text-gray-500">暂无部门，点击"新增部门"创建</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 部门模态框 -->
    <div x-show="modal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center bg-black/40" @click.self="modal = false">
        <div class="bg-white dark:bg-slate-800 rounded-lg shadow-xl w-[420px] p-5">
            <h3 class="text-lg font-semibold mb-4" x-text="form.id ? '编辑部门' : '新增部门'"></h3>
            <div class="space-y-3">
                <div>
                    <label class="label">部门名称</label>
                    <input class="input w-full" x-model="form.dept_name">
                </div>
                <div>
                    <label class="label">上级部门</label>
                    <select class="select w-full" x-model="form.parent_id">
                        <option :value="null">无（顶级）</option>
                        <template x-for="d in flat" :key="d.id">
                            <option :value="d.id" x-text="'　'.repeat(d.level) + d.dept_name"></option>
                        </template>
                    </select>
                </div>
                <div>
                    <label class="label">负责人</label>
                    <input class="input w-full" x-model="form.leader">
                </div>
                <div>
                    <label class="label">联系电话</label>
                    <input class="input w-full" x-model="form.phone">
                </div>
                <div>
                    <label class="label">显示顺序</label>
                    <input class="input w-full" type="number" x-model="form.order_num">
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-5">
                <button class="btn btn-secondary" @click="modal = false">取消</button>
                <button class="btn btn-primary" @click="save()">保存</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    function deptManager() {
        return {
            tree: [], flat: [], modal: false, form: {},

            flatten(nodes, level = 0) {
                let out = [];
                for (const n of nodes || []) {
                    out.push(Object.assign({ level }, n));
                    out = out.concat(this.flatten(n.children, level + 1));
                }
                return out;
            },

            async load() {
                try {
                    const r = await fetch('/api/dept', { credentials: 'include', headers: authHeaders() });
                    if (r.ok) {
                        const d = await r.json();
                        this.tree = d.items || [];
                        this.flat = this.flatten(this.tree);
                    } else if (r.status === 401) { window.location.href = '/login'; }
                } catch (e) { console.error(e); }
            },

            openAdd(parentId = null) {
                this.form = { dept_name: '', parent_id: parentId, leader: '', phone: '', order_num: 0 };
                this.modal = true;
            },

            openEdit(d) {
                this.form = { id: d.id, dept_name: d.dept_name, parent_id: d.parent_id, leader: d.leader, phone: d.phone, order_num: d.order_num };
                this.modal = true;
            },

            async save() {
                const isEdit = !!this.form.id;
                const r = await fetch(isEdit ? '/api/dept/' + this.form.id : '/api/dept', {
                    method: isEdit ? 'PUT' : 'POST',
                    credentials: 'include',
                    headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
                    body: JSON.stringify(this.form)
                });
                const d = await r.json().catch(() => ({}));
                if (!r.ok) { alert(d.detail || d.msg || '保存失败'); return; }
                this.modal = false;
                this.load();
            },

            async remove(d) {
                if (!confirm('确认删除部门「' + d.dept_name + '」？')) return;
                const r = await fetch('/api/dept/' + d.id, {
                    method: 'DELETE', credentials: 'include', headers: authHeaders()
                });
                const j = await r.json().catch(() => ({}));
                if (!r.ok) { alert(j.detail || j.msg || '删除失败'); return; }
                this.load();
            },

            init() { this.load(); }
        };
    }
</script>
{% endblock %}
