<!-- 任课安排页（M5-G 双端一致：Web 端） -->
{% extends "index.html" %}

{% block title %}任课安排 - 教务管理系统{% endblock %}

{% block content %}
<div class="space-y-4" x-data="teacherAssign()">
    <!-- 工具栏 -->
    <div class="card">
        <div class="card-body flex flex-wrap gap-3 items-end">
            <div class="min-w-[200px]">
                <label class="label" for="teacher">教师</label>
                <select id="teacher" class="select w-44" x-model="filters.teacher_id" @change="onTeacherChange()">
                    <option value="">全部教师</option>
                    <template x-for="t in teachers" :key="t.id">
                        <option :value="t.id" x-text="t.name + '（' + (t.staff_no || '') + '）'"></option>
                    </template>
                </select>
            </div>
            <div class="flex-1 min-w-[200px]">
                <label class="label" for="kw">关键字</label>
                <input id="kw" type="text" class="input" placeholder="教师姓名 / 工号 / 科目 / 班级"
                       x-model="filters.keyword" @keydown.enter="load(1)">
            </div>
            <button class="btn btn-primary" @click="load(1)">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                查询
            </button>
            <button class="btn btn-secondary" @click="resetFilters()">重置</button>
            <button class="btn btn-secondary" @click="loadTeachers()">刷新教师</button>
        </div>
    </div>

    <!-- 任课安排列表 -->
    <div class="card">
        <div class="card-header flex items-center justify-between">
            <h2 class="text-lg font-semibold">任课安排列表</h2>
            <span class="badge badge-primary" x-text="total + ' 条'"></span>
        </div>
        <div class="overflow-x-auto">
            <table class="table">
                <thead>
                    <tr>
                        <th>教师</th>
                        <th>工号</th>
                        <th>科目</th>
                        <th>班级</th>
                        <th>学期</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="a in assignList" :key="a.id">
                        <tr>
                            <td class="font-medium" x-text="a.teacher_name || '—'"></td>
                            <td x-text="a.teacher_no || a.staff_no || '—'"></td>
                            <td><span class="badge badge-success" x-text="a.subject_name || '—'"></span></td>
                            <td x-text="a.class_name || '—'"></td>
                            <td x-text="a.semester_label || a.semester_name || '—'"></td>
                        </tr>
                    </template>
                    <tr x-show="!loading && assignList.length === 0">
                        <td colspan="5" class="text-center py-8 text-gray-500 dark:text-gray-400">暂无任课安排数据</td>
                    </tr>
                    <tr x-show="loading">
                        <td colspan="5" class="py-8"><div class="skeleton-text w-2/3 mx-auto"></div></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer flex items-center justify-between">
            <div class="text-sm text-gray-500 dark:text-gray-400">
                共 <span x-text="total"></span> 条 · 第 <span x-text="page"></span>/<span x-text="totalPages()"></span> 页
            </div>
            <div class="pagination">
                <button class="pagination-btn" :disabled="page <= 1" @click="load(page-1)">上一页</button>
                <button class="pagination-btn" :disabled="page >= totalPages()" @click="load(page+1)">下一页</button>
            </div>
        </div>
    </div>
</div>

<script>
    function teacherAssign() {
        return {
            teachers: [],
            assignList: [],
            total: 0,
            page: 1,
            pageSize: 20,
            loading: false,
            filters: { teacher_id: '', keyword: '' },

            async load(p) {
                this.page = p || 1;
                this.loading = true;
                try {
                    const params = new URLSearchParams({
                        page: this.page,
                        page_size: this.pageSize,
                        ...this.filters
                    });
                    const resp = await fetch('/api/teachers/assignments?' + params, {
                        credentials: 'include', headers: authHeaders()
                    });
                    if (resp.ok) {
                        const d = await resp.json();
                        this.assignList = d.items || [];
                        this.total = d.total || 0;
                    } else if (resp.status === 401) {
                        window.location.href = '/login';
                    }
                } catch (e) {
                    console.error('加载任课安排失败:', e);
                } finally {
                    this.loading = false;
                }
            },

            async loadTeachers() {
                try {
                    const resp = await fetch('/api/teachers?page_size=500', {
                        credentials: 'include', headers: authHeaders()
                    });
                    if (resp.ok) {
                        this.teachers = (await resp.json()).items || [];
                    }
                } catch (e) {
                    console.error('加载教师列表失败:', e);
                }
            },

            // 后端 /api/teachers/assignments 仅支持 keyword/subject_id 过滤，
            // 选中教师时同步其姓名到关键字实现筛选
            onTeacherChange() {
                const t = this.teachers.find(x => x.id === Number(this.filters.teacher_id));
                this.filters.keyword = t ? t.name : this.filters.keyword;
                this.load(1);
            },

            resetFilters() {
                this.filters = { teacher_id: '', keyword: '' };
                this.load(1);
            },
            totalPages() { return Math.max(1, Math.ceil(this.total / this.pageSize)); },

            init() {
                this.loadTeachers();
                this.load(1);
            }
        };
    }
</script>
{% endblock %}
